name: Windows release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run release:check
      - run: npm test
      - run: npm run test:desktop
      - run: npm run build:win
      - run: npm run test:package
      - name: Publish verified Windows app
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$env:GITHUB_REF_NAME" --json tagName --jq .tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'This release is already published; keeping its verified assets.'
            exit 0
          }
          gh release create "$env:GITHUB_REF_NAME" dist/Branchlight.exe dist/SHA256SUMS.txt --verify-tag --title "Branchlight $env:GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
          exit $LASTEXITCODE
